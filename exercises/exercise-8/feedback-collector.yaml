apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-collector
  labels:
    app: feedback-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feedback-collector
  template:
    metadata:
      labels:
        app: feedback-collector
    spec:
      containers:
        - name: feedback-collector-container
          image: noerklit/feedback_collector
          ports:
            - containerPort: 5000
              name: app
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-collector-service
spec:
  selector:
    app: feedback-collector
  type: LoadBalancer  
  ports:
    - name: app-port
      protocol: TCP
      port: 5000
      targetPort: 5000